<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#05080f"/>
  <rect x="20" y="20" width="180" height="360" rx="10" fill="#111827" stroke="#1f2937"/>
  <!-- Sidebar items -->
  <rect x="40" y="50" width="140" height="30" rx="5" fill="#14b8a6" fill-opacity="0.2"/>
  <text x="50" y="70" fill="#14b8a6" font-family="sans-serif" font-weight="bold" font-size="14">Tableau de bord</text>
  <text x="50" y="110" fill="#9ca3af" font-family="sans-serif" font-size="14">Analytique</text>
  <text x="50" y="150" fill="#9ca3af" font-family="sans-serif" font-size="14">Utilisateurs</text>
  <text x="50" y="190" fill="#9ca3af" font-family="sans-serif" font-size="14">Paramètres</text>
  <!-- Main content -->
  <text x="230" y="50" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="24">Aperçu Général</text>
  <!-- Stat cards -->
  <rect x="230" y="80" width="160" height="80" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="250" y="110" fill="#9ca3af" font-family="sans-serif" font-size="12">Revenus Mensuels</text>
  <text x="250" y="140" fill="#14b8a6" font-family="sans-serif" font-weight="bold" font-size="20">12 450 €</text>

  <rect x="410" y="80" width="160" height="80" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="430" y="110" fill="#9ca3af" font-family="sans-serif" font-size="12">Nouveaux Clients</text>
  <text x="430" y="140" fill="#6366f1" font-family="sans-serif" font-weight="bold" font-size="20">+ 342</text>

  <rect x="590" y="80" width="160" height="80" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="610" y="110" fill="#9ca3af" font-family="sans-serif" font-size="12">Taux de conversion</text>
  <text x="610" y="140" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="20">4.2 %</text>

  <!-- Chart area -->
  <rect x="230" y="180" width="520" height="200" rx="10" fill="#111827" stroke="#1f2937"/>
  <!-- Decorative chart line -->
  <path d="M 250 340 L 300 300 L 350 320 L 400 240 L 450 260 L 550 200 L 650 220 L 720 190" fill="none" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 250 340 L 300 300 L 350 320 L 400 240 L 450 260 L 550 200 L 650 220 L 720 190 L 720 380 L 250 380 Z" fill="url(#grad1)" opacity="0.2"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>
