<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#05080f"/>
  <!-- Glowing orbs -->
  <circle cx="150" cy="80" r="150" fill="#6366f1" opacity="0.15" filter="blur(40px)"/>
  <circle cx="650" cy="300" r="200" fill="#14b8a6" opacity="0.1" filter="blur(50px)"/>
  
  <text x="400" y="140" fill="#ffffff" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">L'Agence Digitale de Demain</text>
  <text x="400" y="190" fill="#9ca3af" font-family="sans-serif" font-size="18" text-anchor="middle">Nous créons des expériences web inoubliables pour propulser</text>
  <text x="400" y="220" fill="#9ca3af" font-family="sans-serif" font-size="18" text-anchor="middle">votre marque vers les sommets.</text>
  
  <rect x="280" y="260" width="110" height="44" rx="22" fill="#14b8a6"/>
  <text x="335" y="288" fill="#05080f" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Découvrir</text>

  <rect x="410" y="260" width="110" height="44" rx="22" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="465" y="288" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Contact</text>
  
  <rect x="250" y="340" width="300" height="80" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="400" y="380" fill="#9ca3af" font-family="sans-serif" font-size="14" text-anchor="middle">Plus de 500 entreprises nous font confiance</text>
</svg>
